  :root{

    --rule:#e2e0da;
    --rule-soft:#eeece6;
    --fret-mode:#7a4a22;
    --fret-condition:#bd670d;
    --fret-component:#1f7a3d;
    --fret-shall:#141311;
    --fret-timing:#1d5fbf;
    --fret-response:#7a2e9e;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font); font-size:17px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:860px; margin:0 auto; padding:32px 32px 90px; scroll-margin-top:80px;}
  a{color:var(--link); text-decoration:none;}
  a:hover{text-decoration:underline;}
  hr{border:none; border-top:1px solid var(--rule); margin:38px 0;}

  /* ---------- TOP NAV ---------- */
  .topnav{
    position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--rule); margin-bottom:32px;
  }
  .topnav-inner{
    max-width:860px; margin:0 auto; padding:12px 32px;
    display:flex; gap:8px; align-items:center; overflow-x:auto; scrollbar-width:none;
  }
  .topnav-inner::-webkit-scrollbar{display:none;}
  .topnav a{
    flex:0 0 auto; font-size:.86rem; font-weight:600; color:var(--text-soft);
    padding:6px 14px; border:1px solid var(--rule); border-radius:20px; white-space:nowrap;
    transition:border-color .15s, color .15s, background .15s;
  }
  .topnav a:hover{border-color:var(--text); color:var(--text); text-decoration:none;}
  p{margin:0 0 16px;}

  /* ---------- HEADER ---------- */
  .header{display:flex; gap:26px; align-items:flex-start;}
  .avatar{width:132px; height:auto; border-radius:3px; flex:0 0 auto; display:block;}
  .header-text h1{font-size:1.95rem; margin:0 0 7px; font-weight:700; letter-spacing:-.01em;}
  .tagline{margin:0 0 12px; color:var(--text-soft); font-size:1.06rem;}
  .contact-links{margin:0; display:flex; gap:18px; flex-wrap:wrap;}
  .contact-links a{
    display:inline-flex; align-items:center; gap:6px; color:var(--text-soft);
    font-size:.94rem; border-bottom:1px solid transparent; padding-bottom:1px;
  }
  .contact-links a:hover{color:var(--link); border-color:var(--link); text-decoration:none;}
  .contact-links svg{width:16px; height:16px; flex:0 0 auto;}
  @media(max-width:520px){
    .header{flex-direction:column; gap:18px;}
    .avatar{width:104px;}
  }

  /* ---------- FRETISH ---------- */
  .fretish{border-left:3px solid var(--rule); margin:38px 0 8px; padding:2px 0 2px 22px;}
  .fretish-label{margin:0 0 12px; font-family:var(--mono); font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint);}
  .fretish-sentence{margin:0; font-size:1.2rem; line-height:1.75;}
  .fretish-sentence .tag{font-weight:700; border-bottom:2px solid; padding-bottom:1px;}
  .tag.mode{color:var(--fret-mode); border-color:var(--fret-mode);}
  .tag.condition{color:var(--fret-condition); border-color:var(--fret-condition);}
  .tag.component{color:var(--fret-component); border-color:var(--fret-component);}
  .tag.shall{color:var(--fret-shall); border-color:var(--fret-shall);}
  .tag.timing{color:var(--fret-timing); border-color:var(--fret-timing);}
  .tag.response{color:var(--fret-response); border-color:var(--fret-response);}
  .parse-row{margin-top:0; max-height:0; overflow:hidden; opacity:0; transition:max-height .3s ease, opacity .3s ease;}
  .parse-row.open{max-height:280px; opacity:1; margin-top:16px;}
  .parse-item{font-family:var(--mono); font-size:.86rem; margin-bottom:6px;}
  .parse-item .lbl{font-weight:700; display:inline-block; width:100px;}
  .parse-item .val{color:var(--text-soft);}
  .parse-toggle{margin-top:16px; background:none; border:none; padding:0; color:var(--link); font-family:var(--font); font-size:.94rem; cursor:pointer;}
  .parse-toggle:hover{text-decoration:underline;}

  section{margin-bottom:6px;}
  h2{
    font-family:var(--mono); font-size:.8rem; text-transform:uppercase; letter-spacing:.12em;
    color:var(--text-faint); font-weight:700; margin:0 0 20px;

  .t-entry{margin-bottom:22px;}
  .t-entry:last-child{margin-bottom:0;}
  .t-date{display:block; font-family:var(--mono); font-size:.82rem; color:var(--text-faint); margin-bottom:4px;}
  .t-entry p{margin:0;}
  .t-entry b{font-weight:700;}

  /* software */
  .sw-entry{margin-bottom:18px;}
  .sw-entry:last-child{margin-bottom:0;}
  .sw-entry b{font-weight:700;}

  /* publications */
  .pub-controls{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:baseline; font-size:.94rem; margin-bottom:8px;}
  .filter-links a{color:var(--text-soft); margin-right:14px; padding-bottom:2px;}
  .filter-links a:last-child{margin-right:0;}
  .filter-links a.active{color:var(--text); font-weight:700; border-bottom:1px solid var(--text);}
  .filter-links a:hover{text-decoration:none; color:var(--link);}
  #pubSearch{
    border:none; border-bottom:1px solid var(--rule); background:none; font-family:var(--font);
    font-size:.94rem; padding:3px 2px; color:var(--text); flex:1 1 160px; min-width:140px;

  #pubSearch:focus{outline:none; border-color:var(--link);}
  .pub-count{font-family:var(--mono); font-size:.76rem; color:var(--text-faint); margin:8px 0 22px;}
  .pub-entry{margin-bottom:17px; padding-bottom:17px; border-bottom:1px solid var(--rule-soft);}
  .pub-entry:last-child{border-bottom:none; margin-bottom:0; padding-bottom:0;}
  .pub-title{margin:0 0 3px; font-weight:700; line-height:1.4;}
  .pub-title a{color:var(--text);}
  .pub-title a:hover{color:var(--link); text-decoration:underline;}
  .pub-meta{margin:0; font-size:.92rem; color:var(--text-soft);}
  .pub-venue{color:var(--text-faint);}
  .pub-tag{font-size:.76rem; color:var(--fret-response); margin-left:7px;}
  .pub-oa{
    display:inline-block; margin-left:7px; font-family:var(--mono); font-size:.68rem; font-weight:700;
    letter-spacing:.03em; color:var(--fret-component); border:1px solid var(--fret-component);
    border-radius:3px; padding:1px 6px; vertical-align:middle;
  }

  /* talks */
  .talk-entry{margin-bottom:17px;}
  .talk-entry:last-child{margin-bottom:0;}
  .talk-year{font-family:var(--mono); font-size:.82rem; color:var(--text-faint);}
  .talk-entry p{margin:2px 0 0;}
  .talk-title{font-weight:700;}
  .talk-sub{color:var(--text-soft); font-size:.93rem;}

  .footer-text{font-size:.92rem; color:var(--text-soft);}

  /* news */
  .news-entry{margin-bottom:16px; display:flex; gap:16px;}
  .news-entry:last-child{margin-bottom:0;}
  .news-date{font-family:var(--mono); font-size:.82rem; color:var(--text-faint); flex:0 0 62px; padding-top:2px;}
  .news-entry p{margin:0;}

  /* selected publications teaser + view-all link */
  .pub-viewall{

  /* publications page back link */
  .back-link{display:inline-block; margin-bottom:28px; font-size:.94rem; color:var(--text-soft);}

  .back-to-top{display:inline-block; margin-top:36px; font-size:.9rem; color:var(--text-soft);}
  .back-to-top:hover{color:var(--link); text-decoration:none;}

function boldName(s){return s.replace('Anastasia Mavridou','<b>Anastasia Mavridou</b>');}

let activeFilter = 'all';
function renderPubs(){
  const q = document.getElementById('pubSearch').value.trim().toLowerCase();
  const filtered = publications.filter(p => {
    const matchesFilter = activeFilter === 'all' || p.type === activeFilter;
    const hay = (p.authors + ' ' + p.title + ' ' + p.venue + ' ' + p.id).toLowerCase();
    const matchesSearch = !q || hay.includes(q);
    return matchesFilter && matchesSearch;
  });
  document.getElementById('pubCount').textContent = `${filtered.length} of ${publications.length} entries`;
  document.getElementById('pubList').innerHTML = filtered.map(p => `
    <div class="pub-entry">
      <p class="pub-title"><a href="${p.url}" target="_blank" rel="noopener">${p.title}</a>${p.free ? `<span class="pub-oa" title="Free to read, no paywall">PDF</span>` : ''}${p.note ? `<span class="pub-tag">${p.note}</span>` : ''}</p>
      <p class="pub-meta">${boldName(p.authors)}</p>
      <p class="pub-meta pub-venue">${p.venue}</p>
    </div>`).join('');
}

function safe(fn, label){
  try { fn(); } catch(e){ console.error('Render failed:', label, e); }
}

safe(renderPubs, 'publications');

safe(() => {
  document.getElementById('pubFilters').addEventListener('click', e => {
    const a = e.target.closest('a');
    if(!a) return;
    e.preventDefault();
    document.querySelectorAll('#pubFilters a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    activeFilter = a.dataset.filter;
    renderPubs();
  });
  document.getElementById('pubSearch').addEventListener('input', renderPubs);
}, 'pub controls');
</script>
